services:
  homeassistant:
    container_name: ha-dev-kaschuetz
    image: ghcr.io/home-assistant/home-assistant:stable
    restart: unless-stopped
    environment:
      - TZ=Europe/Berlin
    ports:
      - "8123:8123"
    volumes:
      - ./ha_config:/config
      - ./custom_components:/config/custom_components
