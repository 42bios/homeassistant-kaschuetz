calculate_optimization:
  name: Calculate Optimization
  description: Create a suggested set of burn parameters from observed Kaschuetz burn data.
  fields:
    entry_id:
      name: Entry ID
      description: Optional config entry id to calculate for only one Kaschuetz device.
      required: false
      example: "abcd1234efgh5678"
      selector:
        text:

preview_only:
  name: Preview Only
  description: Show a read-only optimization preview with current values, suggested values, and deltas. No values are written.
  fields:
    entry_id:
      name: Entry ID
      description: Optional config entry id to preview for only one Kaschuetz device.
      required: false
      example: "abcd1234efgh5678"
      selector:
        text:

export_burn_history:
  name: Export Burn History
  description: Export TempArr/KlappeArr/Time_s plus derived KPIs for diagnostics and automation.
  fields:
    entry_id:
      name: Entry ID
      description: Optional config entry id to export history for only one Kaschuetz device.
      required: false
      example: "abcd1234efgh5678"
      selector:
        text:
    include_arrays:
      name: Include arrays
      description: Include TempArr and KlappeArr arrays in export payload.
      required: false
      default: true
      selector:
        boolean:
    max_points:
      name: Max points
      description: Maximum history points to include from the tail of arrays.
      required: false
      default: 240
      selector:
        number:
          min: 20
          max: 1000
          step: 10
          mode: box

export_burn_history_file:
  name: Export Burn History File
  description: Export burn history snapshot to /config/kaschuetz_exports as JSON or CSV.
  fields:
    entry_id:
      name: Entry ID
      description: Optional config entry id to export history for only one Kaschuetz device.
      required: false
      example: "abcd1234efgh5678"
      selector:
        text:
    include_arrays:
      name: Include arrays
      description: Include TempArr and KlappeArr arrays in export payload/file.
      required: false
      default: true
      selector:
        boolean:
    max_points:
      name: Max points
      description: Maximum history points to include from the tail of arrays.
      required: false
      default: 240
      selector:
        number:
          min: 20
          max: 1000
          step: 10
          mode: box
    format:
      name: File format
      description: Output format for exported file.
      required: false
      default: json
      selector:
        select:
          options:
            - json
            - csv

apply_optimization:
  name: Apply Optimization
  description: Stage the suggested burn parameters as changed values and optionally start the save process. Works only when experimental auto optimization is enabled in integration options.
  fields:
    entry_id:
      name: Entry ID
      description: Optional config entry id to apply settings for only one Kaschuetz device.
      required: false
      example: "abcd1234efgh5678"
      selector:
        text:
    start_save:
      name: Start save process
      description: Start the save process after staging (open and close the filling door at the oven).
      required: false
      default: false
      selector:
        boolean:
    min_confidence:
      name: Minimum confidence
      description: Only applies optimization if confidence is at least this level.
      required: false
      default: low
      selector:
        select:
          options:
            - low
            - medium
            - high

optimize_and_apply:
  name: Optimize And Apply
  description: Shortcut for apply_optimization with confidence gating. Works only when experimental auto optimization is enabled in integration options.
  fields:
    entry_id:
      name: Entry ID
      description: Optional config entry id to apply settings for only one Kaschuetz device.
      required: false
      example: "abcd1234efgh5678"
      selector:
        text:
    start_save:
      name: Start save process
      description: Start the save process after staging (open and close the filling door at the oven).
      required: false
      default: false
      selector:
        boolean:
    min_confidence:
      name: Minimum confidence
      description: Only applies optimization if confidence is at least this level.
      required: false
      default: medium
      selector:
        select:
          options:
            - low
            - medium
            - high

reset_optimization_data:
  name: Reset Optimization Data
  description: Delete observed burn samples used by the optimizer.
  fields:
    entry_id:
      name: Entry ID
      description: Optional config entry id to reset data for only one Kaschuetz device.
      required: false
      example: "abcd1234efgh5678"
      selector:
        text:

start_save_process:
  name: Save parameters
  description: Start the controller's save process for the changed parameters. Only possible in the states waiting for active, idle or burn finished. Then open, hold open and close the filling door at the oven within 30 seconds.
  fields:
    entry_id:
      name: Entry ID
      description: Optional config entry id to address only one Kaschuetz device.
      required: false
      example: "abcd1234efgh5678"
      selector:
        text:

cancel_save_process:
  name: Cancel save process
  description: Cancel a running save process.
  fields:
    entry_id:
      name: Entry ID
      description: Optional config entry id to address only one Kaschuetz device.
      required: false
      example: "abcd1234efgh5678"
      selector:
        text:

discard_pending_parameters:
  name: Discard changed parameters
  description: Discard all parameters changed in Home Assistant that have not been saved yet.
  fields:
    entry_id:
      name: Entry ID
      description: Optional config entry id to address only one Kaschuetz device.
      required: false
      example: "abcd1234efgh5678"
      selector:
        text:
