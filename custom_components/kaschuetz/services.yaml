calculate_optimization:
  name: Calculate Optimization
  description: Create a suggested set of burn parameters from observed Kaschuetz burn data.
  fields:
    entry_id:
      name: Entry ID
      description: Optional config entry id to calculate for only one Kaschuetz device.
      required: false
      example: "abcd1234efgh5678"
      selector:
        text:

preview_only:
  name: Preview Only
  description: Show a read-only optimization preview with current values, suggested values, and deltas. No values are written.
  fields:
    entry_id:
      name: Entry ID
      description: Optional config entry id to preview for only one Kaschuetz device.
      required: false
      example: "abcd1234efgh5678"
      selector:
        text:

export_burn_history:
  name: Export Burn History
  description: Export TempArr/KlappeArr/Time_s plus derived KPIs for diagnostics and automation.
  fields:
    entry_id:
      name: Entry ID
      description: Optional config entry id to export history for only one Kaschuetz device.
      required: false
      example: "abcd1234efgh5678"
      selector:
        text:
    include_arrays:
      name: Include arrays
      description: Include TempArr and KlappeArr arrays in export payload.
      required: false
      default: true
      selector:
        boolean:
    max_points:
      name: Max points
      description: Maximum history points to include from the tail of arrays.
      required: false
      default: 240
      selector:
        number:
          min: 20
          max: 1000
          step: 10
          mode: box

apply_optimization:
  name: Apply Optimization
  description: Apply suggested burn parameters to integration options and optionally write them to the device. Works only when experimental auto optimization is enabled in integration options.
  fields:
    entry_id:
      name: Entry ID
      description: Optional config entry id to apply settings for only one Kaschuetz device.
      required: false
      example: "abcd1234efgh5678"
      selector:
        text:
    write_to_device:
      name: Write to device
      description: When enabled, values are sent to the oven with rqType=8 before saving options.
      required: false
      default: false
      selector:
        boolean:
    min_confidence:
      name: Minimum confidence
      description: Only applies optimization if confidence is at least this level.
      required: false
      default: low
      selector:
        select:
          options:
            - low
            - medium
            - high

optimize_and_apply:
  name: Optimize And Apply
  description: Shortcut for apply_optimization with confidence gating. Works only when experimental auto optimization is enabled in integration options.
  fields:
    entry_id:
      name: Entry ID
      description: Optional config entry id to apply settings for only one Kaschuetz device.
      required: false
      example: "abcd1234efgh5678"
      selector:
        text:
    write_to_device:
      name: Write to device
      description: When enabled, values are sent to the oven with rqType=8 before saving options.
      required: false
      default: false
      selector:
        boolean:
    min_confidence:
      name: Minimum confidence
      description: Only applies optimization if confidence is at least this level.
      required: false
      default: medium
      selector:
        select:
          options:
            - low
            - medium
            - high

reset_optimization_data:
  name: Reset Optimization Data
  description: Delete observed burn samples used by the optimizer.
  fields:
    entry_id:
      name: Entry ID
      description: Optional config entry id to reset data for only one Kaschuetz device.
      required: false
      example: "abcd1234efgh5678"
      selector:
        text:
