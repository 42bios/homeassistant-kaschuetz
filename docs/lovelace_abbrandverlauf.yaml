# Kaschuetz Abbrandverlauf (final)
#
# Requires:
# - ApexCharts Card (HACS Frontend)
# - Config Template Card (HACS Frontend)
#
# Shows:
# - Dynamic title with current burn status (language based on HA UI)
# - Last 3 hours in local time (HH:mm, no seconds)
# - Temperature + flap position

type: custom:config-template-card
entities:
  - sensor.kaschuetz_oven_burn_status
card:
  type: custom:apexcharts-card
  header:
    show: true
    title: "${(function(){ const key=(states['sensor.kaschuetz_oven_burn_status']&&states['sensor.kaschuetz_oven_burn_status'].state)?states['sensor.kaschuetz_oven_burn_status'].state:'unknown'; const isDe=String((navigator&&navigator.language)?navigator.language:'de').toLowerCase().startsWith('de'); const mapDe={standby:'Standby',start:'Start',operation:'Betrieb',embers_phase:'Glutphase',waiting_for_activation:'Warte auf Aktivierung',idle:'Ruhezustand',filling_door_open:'Fülltüre offen',searching_maximum:'Suche Maximum',burn_control:'Abbrandregelung',burn_finished:'Abbrand beendet',unknown:'Unbekannt'}; const mapEn={standby:'Standby',start:'Start',operation:'Operation',embers_phase:'Embers phase',waiting_for_activation:'Waiting for activation',idle:'Idle',filling_door_open:'Filling door open',searching_maximum:'Searching maximum',burn_control:'Burn control',burn_finished:'Burn finished',unknown:'Unknown'}; const map=isDe?mapDe:mapEn; return (isDe?'Abbrandverlauf':'Burn curve')+' - '+(map[key]||map.unknown); })()}"
    show_states: true
    colorize_states: true
  graph_span: 3h
  span:
    end: minute
  apex_config:
    chart:
      height: 320
    grid:
      borderColor: "#89a654"
    stroke:
      width: 3
    legend:
      show: true
    xaxis:
      labels:
        datetimeUTC: false
        format: "HH:mm"
    yaxis:
      - id: temp
        min: 0
        max: 1000
        decimalsInFloat: 0
        labels:
          minWidth: 36
          style:
            fontSize: 13px
        title:
          text: Temperatur (°C)
          rotate: -90
          offsetX: 0
          offsetY: 0
          style:
            fontSize: 15px
            fontWeight: 400
            color: "#444444"
      - id: flap
        opposite: true
        min: 0
        max: 100
        decimalsInFloat: 0
        labels:
          minWidth: 30
          style:
            fontSize: 13px
        title:
          text: Klappe %
          rotate: 90
          offsetX: 0
          offsetY: 0
          style:
            fontSize: 15px
            fontWeight: 400
            color: "#444444"
  series:
    - entity: sensor.kaschuetz_oven_temperature
      name: Temperatur
      yaxis_id: temp
      type: line
      color: "#f0d36b"
    - entity: sensor.kaschuetz_oven_flap_position
      name: Klappenposition
      yaxis_id: flap
      type: area
      color: "#d18a1d"
      opacity: 0.35
